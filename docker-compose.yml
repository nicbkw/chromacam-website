version: '3.8'

# Docker Compose for chromacam.art

services:
  chromacam-art-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chromacam_art_web
    restart: always
    ports:
      - "${PORT:-8090}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
